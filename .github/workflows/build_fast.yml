name: Build qView AVX2

on:
  workflow_dispatch:
    inputs:
      isRelease:
        type: boolean
        description: 'Is this a release build?'
        required: false
        default: false
      appleNotarize:
        type: boolean
        description: 'Notarize with Apple?'
        required: false
        default: false

jobs:
  build:
    runs-on: windows-2022

    env:
      # MSVC compile flags:
      # /O2        = optimize for speed
      # /arch:AVX2 = enable AVX2 code generation
      # /GL        = whole-program/global optimization
      CL: "/O2 /arch:AVX2 /GL"
      _CL_: "/O2 /arch:AVX2 /GL"

      # MSVC linker flags:
      # /LTCG = link-time code generation, used with /GL
      LINK: "/LTCG"
      _LINK_: "/LTCG"

    steps:
      - name: Set environment variables
        shell: bash
        run: |
          echo "qtArch=win64_msvc2022_64" >> $GITHUB_ENV
          echo "osSuffix=_64" >> $GITHUB_ENV
          echo "buildArch=" >> $GITHUB_ENV
          if [ "${{ inputs.isRelease }}" ?= "true" ]; then
            buildNum=$(date '+%Y-%m-%d').$GITHUB_RUN_ATTEMPT
            echo "nightlyDefines=NIGHTLY=$buildNum" >> $GITHUB_ENV
            echo "nightlyString=-nightly" >> $GITHUB_ENV
            echo "buildNumString=$buildNum" >> $GITHUB_ENV
          fi

      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true
          modules: qtimageformats

      - name: Force MSVC AVX2, O2, and global optimization in qmake
        shell: pwsh
        run: |
          $flags = @"

          # Added by GitHub Actions workflow: x64 AVX2 optimized release build
          QMAKE_CFLAGS_RELEASE += /O2 /arch:AVX2 /GL
          QMAKE_CXXFLAGS_RELEASE += /O2 /arch:AVX2 /GL
          QMAKE_LFLAGS_RELEASE += /LTCG
          QMAKE_LFLAGS += /LTCG
          "@

          Get-ChildItem -Path . -Recurse -Include *.pro,*.pri | ForEach-Object {
            Add-Content -Path $_.FullName -Value $flags
            Write-Host "Added AVX2/O2/GL/LTCG flags to $($_.FullName)"
          }

      - name: Build qView
        shell: pwsh
        run: dist/scripts/build.ps1

      - name: Deploy qView
        env:
          APPLE_NOTARIZE_REQUESTED: ${{ inputs.appleNotarize }}
          APPLE_DEVID_APP_CERT_DATA: ${{ secrets.APPLE_DEVID_APP_CERT_DATA }}
          APPLE_DEVID_APP_CERT_PASS: ${{ secrets.APPLE_DEVID_APP_CERT_PASS }}
          APPLE_ID_USER: ${{ secrets.APPLE_ID_USER }}
          APPLE_ID_PASS: ${{ secrets.APPLE_ID_PASS }}
        shell: pwsh
        run: |
          Invoke-Expression "& 'dist/scripts/download-plugins.ps1'"
          Invoke-Expression "& 'dist/scripts/windeployqt.ps1' ${{ env.buildNumString }}"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: qView${{ env.nightlyString }}-Windows${{ env.osSuffix }}-${{ env.buildNumString }}
          path: bin
